name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "27.3.4.14"
          - elixir: "1.20.4"
            otp: "29.0.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          install-hex: false
          install-rebar: false
      - run: mix local.hex 2.5.1 --force && mix local.rebar --force
      - run: mix deps.get --check-locked
      # Existing tests modify application config and attach unscoped telemetry handlers.
      - run: mix test --warnings-as-errors --max-cases 1
